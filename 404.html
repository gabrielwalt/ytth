<!DOCTYPE html>
<html lang="en">

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found | Your Track to Health</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'primary', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('main.error .button-container');
          btnContainer.prepend(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    // the search field suggests pages while typing, and starts with the words of the missing
    // address ("/benefits/dental-plan" → "dental plan") so visitors see likely matches at once
    import attachSuggestions from '/scripts/search-suggest.js';

    window.hlx = window.hlx || {};
    window.hlx.codeBasePath = window.hlx.codeBasePath || '';
    const input = document.getElementById('error-q');
    if (input) {
      attachSuggestions(input);
      const last = window.location.pathname.split('/').filter(Boolean).pop() || '';
      const words = decodeURIComponent(last).replace(/\.[a-z]+$/i, '').replace(/[-_]+/g, ' ').trim();
      if (/^[a-z][a-z0-9 ]{2,60}$/i.test(words) && !/^(index|default|content|page)$/i.test(words)) {
        input.value = words;
        input.addEventListener('focus', () => input.select(), { once: true });
      }
    }
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    /* 404 in the redesign: navy page header with track lines, a search field and ways back */
    main.error {
      padding-top: 0;
    }

    main.error .error-hero {
      padding: calc(var(--nav-height) + 72px) 30px 72px;
      background: var(--color-navy) url('/styles/images/bg-tracks-navy.svg') center top / 1440px auto no-repeat;
      color: var(--color-white);
    }

    main.error .error-inner,
    main.error .error-body {
      max-width: calc(var(--container) + 60px);
      margin: 0 auto;
    }

    main.error .eyebrow {
      margin: 0 0 12px;
      color: var(--color-mint);
    }

    main.error h1 {
      max-width: var(--container-text);
      margin: 0;
      color: var(--color-white);
    }

    main.error .error-hero p:not(.eyebrow) {
      max-width: var(--container-text);
      margin: 16px 0 0;
      font-size: var(--body-font-size-xl);
      line-height: var(--body-line-height-xl);
    }

    main.error .error-body {
      padding: 48px 30px 80px;
    }

    main.error .error-search {
      display: flex;
      gap: 12px;
      max-width: var(--container-text);
      margin: 0 0 32px;
    }

    main.error .error-search input {
      flex: 1;
      min-width: 0;
      height: var(--button-height);
      border: var(--border);
      border-radius: var(--radius-s);
      padding: 0 14px;
    }

    main.error .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 0;
    }

    @media (width >= 900px) {
      main.error .error-hero {
        padding: calc(var(--nav-height) + 85px) var(--gutter) 92px;
      }

      main.error .error-body {
        padding: 56px var(--gutter) 108px;
      }
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="error-hero">
      <section class="error-inner">
        <p class="eyebrow">Error 404</p>
        <h1>We can’t find that page</h1>
        <p>The page may have moved when the site was redesigned. Try a search, or start again from the homepage.</p>
      </section>
    </div>
    <div class="error-body">
      <form class="error-search" action="/search" method="get" role="search">
        <label class="visually-hidden" for="error-q">Search the site</label>
        <input id="error-q" type="search" name="q" placeholder="How can we help you today?">
        <button type="submit" class="button primary">Search</button>
      </form>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go to the homepage</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
